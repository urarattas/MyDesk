name: bridge

on:
  push:
    branches: [main, single-file, server]
    paths:
      - "bridge/**"
      - "scripts/check-bridge.mjs"
      - "MyDesk.html"
      - ".github/workflows/bridge.yml"
    tags: ["bridge-v*"]
  pull_request:
    paths:
      - "bridge/**"
      - "scripts/check-bridge.mjs"
      - "MyDesk.html"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the embedded script matches bridge/bridge.py
        run: node scripts/check-bridge.mjs

      - name: Build MyDeskBridge.exe
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --name MyDeskBridge --distpath dist --workpath build bridge.py

      - name: Smoke test the exe
        working-directory: bridge
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MyDeskBridge.exe -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:8765/healthz" -TimeoutSec 2
                if ($r.ok) { Write-Host "healthz: $($r | ConvertTo-Json -Compress)"; $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "bridge did not answer on 127.0.0.1:8765" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Compute checksum
        working-directory: bridge
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\MyDeskBridge.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MyDeskBridge.exe" | Out-File -Encoding ascii dist\MyDeskBridge.exe.sha256
          Get-Content dist\MyDeskBridge.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MyDeskBridge-windows-x64
          path: |
            bridge/dist/MyDeskBridge.exe
            bridge/dist/MyDeskBridge.exe.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bridge/dist/MyDeskBridge.exe
            bridge/dist/MyDeskBridge.exe.sha256
