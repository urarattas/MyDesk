name: html

on:
  push:
    branches: [server]
    paths:
      - "MyDesk.html"
      - ".github/workflows/html.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: standalone html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checksum
        run: sha256sum MyDesk.html > MyDesk.html.sha256

      - name: Publish the html release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view html >/dev/null 2>&1 || \
            gh release create html \
              --title "MyDesk standalone HTML" \
              --notes "Single-file app, built from ${GITHUB_SHA:0:7}." \
              --latest=false
          gh release upload html MyDesk.html MyDesk.html.sha256 --clobber
          gh release edit html \
            --notes "Single-file app, built from ${GITHUB_SHA:0:7}."

      - uses: actions/upload-artifact@v4
        with:
          name: MyDesk-html
          path: |
            MyDesk.html
            MyDesk.html.sha256
