name: desktop

on:
  push:
    branches: [rust-desktop]
    paths:
      - "desktop/**"
      - "MyDesk.html"
      - "docker/linux-build.Dockerfile"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "MyDesk.html"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libxkbcommon-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Unit tests (mydesk-core)
        working-directory: desktop
        run: cargo test -p mydesk-core --locked

      - name: Type-check the desktop crate
        working-directory: desktop
        run: cargo check -p mydesk-desktop --locked

  linux-bundles:
    name: linux bundles
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the pinned build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux-build.Dockerfile
          load: true
          tags: mydesk-linux-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: desktop/.cargo-home
          key: cargo-registry-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: cargo tauri build (deb + AppImage) inside the image
        run: |
          mkdir -p desktop/.cargo-home
          docker run --rm \
            -v "$PWD:/src" -w /src \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/src/desktop/.cargo-home \
            mydesk-linux-build:ci \
            bash -lc 'cd desktop/crates/mydesk-desktop && cargo tauri build --bundles deb,appimage --ci'

      - name: Collect bundles
        run: |
          mkdir -p dist
          find desktop/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: mydesk-linux
          path: dist/*
          if-no-files-found: error

  windows-bundles:
    name: windows bundles
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: cargo tauri build (nsis + msi)
        working-directory: desktop/crates/mydesk-desktop
        run: cargo tauri build --bundles nsis,msi --ci

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          find desktop/target/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" \) -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: mydesk-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux-bundles, windows-bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
