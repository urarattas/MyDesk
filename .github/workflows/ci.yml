name: ci

# 快速反馈：只跑纯逻辑测试，不产出任何发布物。
# 真正的构建与发布在 release.yml 里（推送 rust-desktop 时统一出一个 latest Release）。

on:
  push:
    branches: [rust-desktop, server, main, single-file]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: server + bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: The embedded bridge script matches bridge/bridge.py
        run: node scripts/check-bridge.mjs

      - name: Signaling server tests (smoke, proxy, hardening)
        run: npm test

  rust:
    name: rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # main / single-file / server 上没有 desktop/，跳过即可
      - if: hashFiles('desktop/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - if: hashFiles('desktop/Cargo.toml') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop

      - if: hashFiles('desktop/Cargo.toml') != ''
        name: Core unit tests
        working-directory: desktop
        run: cargo test -p mydesk-core --locked
