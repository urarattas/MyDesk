[package]
name = "mydesk-desktop"
description = "MyDesk 桌面客户端（Tauri 2）：无浏览器外壳、无 Python 桥接，原生注入本机键鼠"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mydesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mydesk-core = { path = "../mydesk-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = [] }
enigo = "0.6"
xcap = "0.9"
# 下面四个在 Windows 与 Linux 都要用（截屏编码 / 日志），不能再放进 cfg(windows)
jpeg-encoder = "0.6"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
